    <rect width="180" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="90" y="17" fill="#34D399" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">★ TOP RATED LANDING PAGE</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="30">Supercharge Your B2B</text>
    <text x="0" y="105" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="900" font-size="30">Client Acquisition Pipeline</text>

    <!-- Subtitle -->
    <text x="0" y="140" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Engineered for 100/100 Google PageSpeed, instant load times,</text>
    <text x="0" y="160" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">and psychological conversion architecture with AI bots.</text>

    <!-- CTA Buttons -->
    <rect x="0" y="190" width="160" height="42" rx="8" fill="url(#btnGrad)"/>
    <text x="80" y="216" fill="#090E17" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle">Book Free Strategy ➔</text>

    <rect x="175" y="190" width="130" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="240" y="216" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">View Live Demo</text>
  </g>

  <!-- Right Floating Conversion Showcase Card -->
  <g transform="translate(480, 80)">
    <rect width="270" height="350" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="25" y="38" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Performance Scorecard</text>
    
    <!-- Gauge 1: Page Speed -->
    <g transform="translate(25, 60)">
      <rect width="220" height="60" rx="8" fill="#0F172A"/>
      <circle cx="35" cy="30" r="18" fill="#064E3B" stroke="#10B981" stroke-width="3"/>
      <text x="35" y="35" fill="#34D399" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">100</text>
      <text x="70" y="27" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Google Lighthouse</text>
      <text x="70" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Perfect Core Web Vitals</text>
