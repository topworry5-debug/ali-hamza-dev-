  <!-- Bottom social proof -->
  <g transform="translate(60, 390)">
    <text x="0" y="15" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">TRUSTED BY INNOVATIVE FOUNDERS & CREATORS GLOBALLY</text>
    <text x="0" y="35" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="700" font-size="14">NextGen AI • CloudMatrix • Apex Media • FinScale PK</text>
