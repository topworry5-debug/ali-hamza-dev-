  </defs>

  <rect width="800" height="500" rx="16" fill="url(#lpBg)"/>
  <rect width="796" height="496" x="2" y="2" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Navigation Bar -->
  <rect width="800" height="48" fill="#1E293B" rx="16 16 0 0"/>
  <circle cx="30" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="66" cy="24" r="6" fill="#10B981"/>
  
  <text x="120" y="29" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="800" font-size="14">AURA CONVERT™</text>
  <text x="500" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Solutions</text>
  <text x="565" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Case Studies</text>
  <text x="645" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Pricing</text>
  
  <rect x="700" y="12" width="75" height="24" rx="12" fill="url(#btnGrad)"/>
  <text x="737" y="28" fill="#0B0F19" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Launch</text>

  <!-- Hero Content Preview -->
  <g transform="translate(60, 90)">
