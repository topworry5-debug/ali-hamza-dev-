    <!-- Gauge 2: Conversion Lift -->
    <g transform="translate(25, 130)">
      <rect width="220" height="60" rx="8" fill="#0F172A"/>
      <circle cx="35" cy="30" r="18" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="3"/>
      <text x="35" y="35" fill="#C4B5FD" font-family="system-ui, sans-serif" font-weight="900" font-size="11" text-anchor="middle">+180%</text>
      <text x="70" y="27" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Lead Conversion Lift</text>
      <text x="70" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">A/B Tested & Verified</text>
    </g>

    <!-- Gauge 3: SEO Visibility -->
    <g transform="translate(25, 200)">
      <rect width="220" height="60" rx="8" fill="#0F172A"/>
      <circle cx="35" cy="30" r="18" fill="#164E63" stroke="#06B6D4" stroke-width="3"/>
      <text x="35" y="35" fill="#67E8F9" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">#1</text>
      <text x="70" y="27" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12">GEO / AEO Rank</text>
      <text x="70" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Schema.org Rich Snippets</text>
    </g>

    <!-- Interactive CTA Mini Pill -->
    <rect x="25" y="280" width="220" height="42" rx="8" fill="#10B981"/>
    <text x="135" y="306" fill="#064E3B" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">⚡ Ready in Under 5 Days</text>
