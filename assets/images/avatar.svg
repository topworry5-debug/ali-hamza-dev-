<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Glow & Ring -->
  <circle cx="300" cy="300" r="280" fill="url(#avatarGlow)" />
  <circle cx="300" cy="300" r="240" fill="url(#avatarGrad)" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="300" cy="300" r="225" fill="#090E17" stroke="#1E293B" stroke-width="2"/>

  <!-- Code/Matrix ambient pattern in background -->
  <g opacity="0.15" font-family="monospace" font-size="13" fill="#10B981">
    <text x="140" y="180">const dev = new AI_Architect();</text>
    <text x="130" y="210">await dev.automateWorkflows();</text>
    <text x="150" y="240">&lt;AliHamza location="ISB" /&gt;</text>
    <text x="135" y="420">status: "Open for Opportunities"</text>
    <text x="145" y="450">stack: ["AI", "Web", "Marketing"]</text>
  </g>

  <!-- Stylized Character Silhouette / Avatar -->
  <!-- Shoulders / Blazer -->
  <path d="M160 500 C160 410, 210 370, 300 370 C390 370, 440 410, 440 500 Z" fill="url(#suitGrad)" />
  <!-- Inner Shirt & Tie/Accent -->
  <path d="M265 370 L300 450 L335 370 Z" fill="#0B0F19"/>
  <path d="M293 370 L307 370 L304 440 L296 440 Z" fill="url(#accentGrad)"/>
  
  <!-- Neck -->
  <path d="M270 330 L330 330 L325 380 L275 380 Z" fill="#D4A373"/>
  <path d="M275 355 C290 370, 310 370, 325 355 Z" fill="#BC8A5F" opacity="0.4"/>

  <!-- Head -->
  <ellipse cx="300" cy="270" rx="65" ry="78" fill="#E0AC7D"/>
  
  <!-- Beard & Chin Shadow -->
  <path d="M242 270 C242 335, 270 355, 300 355 C330 355, 358 335, 358 270 C358 300, 345 342, 300 342 C255 342, 242 300, 242 270 Z" fill="#1E293B"/>
  <path d="M280 325 C290 330, 310 330, 320 325 C315 330, 285 330, 280 325 Z" fill="#0F172A"/>

  <!-- Stylish Modern Haircut -->
  <path d="M232 250 C232 185, 260 170, 310 170 C360 170, 372 200, 370 245 C355 220, 330 205, 290 208 C260 210, 240 230, 232 250 Z" fill="#0F172A"/>
  
  <!-- Eyebrows -->
  <path d="M260 245 C270 240, 282 242, 288 246" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <path d="M312 246 C318 242, 330 240, 340 245" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

  <!-- Modern Glasses (Smart / Tech Style) -->
  <rect x="250" y="250" width="40" height="26" rx="6" fill="rgba(6,182,212,0.12)" stroke="url(#accentGrad)" stroke-width="3"/>
  <rect x="310" y="250" width="40" height="26" rx="6" fill="rgba(6,182,212,0.12)" stroke="url(#accentGrad)" stroke-width="3"/>
  <path d="M290 260 L310 260" stroke="#06B6D4" stroke-width="3"/>
  <path d="M250 258 L238 254" stroke="#06B6D4" stroke-width="2.5"/>
  <path d="M350 258 L362 254" stroke="#06B6D4" stroke-width="2.5"/>

  <!-- Eyes -->
  <circle cx="270" cy="263" r="4.5" fill="#0F172A"/>
  <circle cx="272" cy="261" r="1.5" fill="#FFFFFF"/>
  <circle cx="330" cy="263" r="4.5" fill="#0F172A"/>
  <circle cx="332" cy="261" r="1.5" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M285 305 Q300 318 315 305" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Floating Tech Badges / Hologram Pills -->
  <!-- Top Left: AI Badge -->
  <g transform="translate(70, 160)" filter="url(#shadow)">
    <rect width="130" height="42" rx="21" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="8" fill="#10B981" opacity="0.3"/>
    <circle cx="24" cy="21" r="4" fill="#10B981"/>
    <text x="42" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13">AI Specialist</text>
  </g>

  <!-- Top Right: Web Dev Badge -->
  <g transform="translate(410, 180)">
    <rect width="125" height="42" rx="21" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="8" fill="#06B6D4" opacity="0.3"/>
    <circle cx="22" cy="21" r="4" fill="#06B6D4"/>
    <text x="38" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13">Web Architect</text>
  </g>

  <!-- Bottom Left: Islamabad Badge -->
  <g transform="translate(80, 390)">
    <rect width="145" height="38" rx="19" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="24" y="24" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12">📍 Pakistan</text>
  </g>

  <!-- Bottom Right: Available Ticker -->
  <g transform="translate(390, 380)">
    <rect width="150" height="42" rx="21" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#34D399"/>
    <text x="36" y="26" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">AVAILABLE NOW</text>
  </g>
</svg>
