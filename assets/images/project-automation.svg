<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad1)"/>
  <rect width="796" height="496" x="2" y="2" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Top App Bar -->
  <rect width="800" height="44" fill="#0F172A" rx="16 16 0 0"/>
  <circle cx="30" cy="22" r="6" fill="#EF4444"/>
  <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="66" cy="22" r="6" fill="#10B981"/>
  <text x="400" y="27" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">AI Multi-Agent Workflow Engine — Live Automation Dashboard</text>

  <!-- Connecting Animated Glowing Paths -->
  <path d="M160 250 C 260 250, 260 160, 360 160" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M160 250 C 260 250, 260 340, 360 340" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M480 160 C 560 160, 560 250, 640 250" fill="none" stroke="#8B5CF6" stroke-width="3"/>
  <path d="M480 340 C 560 340, 560 250, 640 250" fill="none" stroke="#EC4899" stroke-width="3"/>

  <!-- Left Node: Webhook Trigger -->
  <g transform="translate(60, 200)">
    <rect width="130" height="100" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect width="130" height="26" fill="#064E3B" rx="12 12 0 0"/>
    <text x="65" y="18" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ WEBHOOK TRIGGER</text>
    <text x="65" y="55" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CRM Event</text>
    <text x="65" y="75" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">event.new_lead</text>
  </g>

  <!-- Middle Top Node: OpenAI / LLM Processing -->
  <g transform="translate(340, 110)">
    <rect width="150" height="100" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="150" height="26" fill="#4C1D95" rx="12 12 0 0"/>
    <text x="75" y="18" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🧠 AI SYNTHESIS</text>
    <text x="75" y="55" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GPT-4o Analysis</text>
    <text x="75" y="75" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Intent & Lead Score</text>
  </g>

  <!-- Middle Bottom Node: Data Enrichment -->
  <g transform="translate(340, 290)">
    <rect width="150" height="100" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <rect width="150" height="26" fill="#164E63" rx="12 12 0 0"/>
    <text x="75" y="18" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔄 AUTO ENRICH</text>
    <text x="75" y="55" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">n8n / Make Pipeline</text>
    <text x="75" y="75" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Sync HubSpot + DB</text>
  </g>

  <!-- Right Node: Multi-Channel Action -->
  <g transform="translate(620, 200)">
    <rect width="140" height="100" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect width="140" height="26" fill="#064E3B" rx="12 12 0 0"/>
    <text x="70" y="18" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🚀 OUTCOME</text>
    <text x="70" y="55" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Instant WhatsApp</text>
    <text x="70" y="75" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Executed 0.3s</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 420)">
    <rect width="680" height="50" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="30" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Daily Automations: <tspan fill="#10B981" font-weight="700">12,450+</tspan></text>
    <text x="260" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Success Rate: <tspan fill="#06B6D4" font-weight="700">99.98%</tspan></text>
    <text x="490" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Avg Time Saved: <tspan fill="#F59E0B" font-weight="700">35 hrs/wk</tspan></text>
  </g>
</svg>
